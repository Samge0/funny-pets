<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>奇幻萌宠 FunPets · 页面迁移</title>
<script>
(function () {
  var loc = window.location;
  var hash = loc.hash || '';
  var search = loc.search || '';
  // 旧子路径 /funny-pets/... → 新根路径 /...
  // 兼容三种宿主：自定义域名根、samge0.github.io/funny-pets/
  var path = loc.pathname;
  if (path.indexOf('/funny-pets/') === 0 || path === '/funny-pets') {
    var newPath = path.replace(/^\/funny-pets\/?/, '/');
    // github.io 宿主必须保留 /funny-pets 前缀（项目页）；自定义域名则剥掉
    var isGithubIo = loc.hostname === 'samge0.github.io';
    var target = isGithubIo
      ? loc.origin + '/funny-pets' + (newPath === '/' ? '/' : newPath) + search + hash
      : loc.origin + newPath + search + hash;
    // 根路径 / 直接跳游戏
    if (newPath === '/') target = loc.origin + '/app/' + search + hash;
    loc.replace(target);
    return;
  }
  // 其他 404 → 首页
  loc.replace(loc.origin + '/');
})();
</script>
</head>
<body style="font-family:sans-serif;text-align:center;padding:40px">
<p>链接已迁移，正在跳转…如果没有自动跳转，<a href="/">点这里回到首页</a>。</p>
</body>
</html>
